# CI pipeline for the payroll event-processing service.
#
# Gates for every push to `main` and every pull request into it:
#   backend  — ESLint, unit tests (Jest), `nest build`
#   frontend — oxlint, Vitest, `tsc -b` + Vite build
#   e2e      — full-stack suites (event submission, queue, processing, retries,
#              idempotency, health, status) against real Postgres + Redis with
#              the in-process worker. Postgres/Redis run as service containers;
#              NO api/worker containers are started, so there is no second
#              worker racing the in-process consumer (the local known race).
#
# All checks must pass before anything merges (configure branch protection to
# require all three). Node alignment: the backend + e2e jobs pin Node 20 to
# match the node:20-alpine API/worker Docker images, and the frontend job uses
# Node 22 — its jsdom-based Vitest suite cannot boot under Node 20
# (undici webidl API absent), and Vite 8 / TypeScript 6 target modern Node.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint · unit · build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: ESLint
        run: npm run lint:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend — lint · vitest · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Oxlint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test:run

      - name: Build
        run: npm run build

  e2e:
    name: E2E — Postgres + Redis, in-process worker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payroll
          POSTGRES_PASSWORD: payroll
          POSTGRES_DB: payroll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payroll -d payroll"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # NOT secrets: the values below are the committed dev/test defaults from
      # .env.example / .env.test / docker-compose.yml, and in this job they only
      # point at the ephemeral postgres/redis service containers on localhost.
      # Anything actually secret (prod DB URL, API token) must be created under
      # Settings → Secrets and variables → Actions and referenced as
      # ${{ secrets.NAME }} — never written inline.
      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://payroll:payroll@localhost:5432/payroll?schema=public

      # The e2e suites boot the Nest app in-process (ts-jest) against the
      # service containers. No `.env.test` exists here, so the variables the
      # app's ConfigModule + Prisma client need are exported directly; the rest
      # (failure rates, worker timings, retry defaults) come from Joi defaults.
      - name: E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://payroll:payroll@localhost:5432/payroll?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: "6379"