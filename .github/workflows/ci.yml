# CI pipeline for the payroll event-processing workspace (pnpm + turborepo).
#
# Gates for every push to `main` and every pull request into it:
#   backend  — ESLint, typecheck, unit tests (Jest), builds — the workspace
#              members the two backend apps depend on, dependency-ordered and
#              cached by turbo
#   frontend — oxlint, Vitest, `tsc -b` + Vite build for @repo/web
#   e2e      — full-stack suites (event submission, queue, processing, retries,
#              idempotency, health, status, tenant isolation) against real
#              Postgres + Redis with the in-process worker. Postgres/Redis run
#              as service containers; NO api/worker containers are started, so
#              there is no second worker racing the in-process consumer (the
#              local known race). Scoped to apps/api's suites.
#
# All checks must pass before anything merges (configure branch protection to
# require all three). Node alignment: the backend + e2e jobs pin Node 20 to
# match the node:20-alpine API/worker Docker images, and the frontend job uses
# Node 22 — its jsdom-based Vitest suite cannot boot under Node 20
# (undici webidl API absent), and Vite 8 / TypeScript 6 target modern Node.
#
# pnpm is pinned once, in the root package.json `packageManager` field
# (pnpm@12.11.2): pnpm/action-setup reads it, setup-node caches the pnpm store
# keyed on the lockfile, and every install is `--frozen-lockfile`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint · typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Setup pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@v4

      - name: Set up Node 20 with a pnpm store cache
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Dependency-ordered by turbo ("^build"), cached between runs. Scoped to
      # the backend members so the Node 22 frontend suite is not dragged into a
      # Node 20 job.
      - name: ESLint, typecheck, unit tests, build
        run: pnpm turbo run lint typecheck test build --filter @repo/api...

  frontend:
    name: Frontend — lint · vitest · build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Setup pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@v4

      - name: Set up Node 22 with a pnpm store cache
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Oxlint, unit tests (Vitest), build
        run: pnpm turbo run lint test build --filter @repo/web...

  e2e:
    name: E2E — Postgres + Redis, in-process worker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payroll
          POSTGRES_PASSWORD: payroll
          POSTGRES_DB: payroll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payroll -d payroll"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Setup pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@v4

      - name: Set up Node 20 with a pnpm store cache
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # NOT secrets: the values below are the committed dev/test defaults from
      # .env.example / docker-compose.yml, and in this job they only point at
      # the ephemeral postgres/redis service containers on localhost.
      # Anything actually secret (prod DB URL, API token) must be created under
      # Settings → Secrets and variables → Actions and referenced as
      # ${{ secrets.NAME }} — never written inline.
      - name: Apply migrations (schema lives in @repo/database)
        run: pnpm --filter @repo/database exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://payroll:payroll@localhost:5432/payroll?schema=public

      - name: Generate the Prisma client
        run: pnpm --filter @repo/database exec prisma generate

      # The e2e suites boot the Nest app in-process (ts-jest) against the
      # service containers and are scoped to @repo/api ("test:e2e"). No
      # .env.development/.env.test exists here (they are host-local and
      # gitignored — design D7), so the variables the app's ConfigModule +
      # Prisma client need are exported directly; the resolver accepts an
      # injected environment, and the rest (failure rates, worker timings,
      # retry defaults) come from Joi defaults.
      - name: E2E tests
        run: pnpm turbo run test:e2e --filter @repo/api...
        env:
          DATABASE_URL: postgresql://payroll:payroll@localhost:5432/payroll?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          # AUTH_JWT_SECRET is REQUIRED with no default — the app refuses to boot
          # without a signing key — so this job supplies a throwaway one.
          AUTH_JWT_SECRET: ci-e2e-only-jwt-secret-not-a-deployment-secret
