<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payroll Event Processing — Frontend Coming Soon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
    }
    .card {
      text-align: center;
      padding: 3rem;
      background: #1e293b;
      border-radius: 1rem;
      border: 1px solid #334155;
      max-width: 480px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #f8fafc; }
    p { color: #94a3b8; margin-bottom: 1.5rem; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      background: #6366f1;
      color: #fff;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    a:hover { background: #4f46e5; }
    .badge {
      display: inline-block;
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #065f46;
      border-radius: 9999px;
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">⚙️ Backend Ready</div>

    <a href="http://localhost:3000/health" target="_blank">Check API Health →</a>
