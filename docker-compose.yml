services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: payroll_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
      POSTGRES_DB: payroll
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: payroll_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    container_name: payroll_api
    restart: unless-stopped
    env_file:
      - apps/api/.env.development
    environment:
      # Compose-network topology: containers reach the DB/Redis by service name,
      # while host runs use the localhost values from .env.development.
      DATABASE_URL: postgresql://payroll:payroll@postgres:5432/payroll?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Top-level priority (compose overrides the env_file): idempotency defaults.
      IDEMPOTENCY_TTL_SECONDS: 86400
      IDEMPOTENCY_SWEEP_INTERVAL_MS: 60000
      # Worker-liveness staleness threshold for /health (design D4).
      HEALTH_WORKER_STALE_MS: 15000
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Worker ─────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: prod
    container_name: payroll_worker
    restart: unless-stopped
    env_file:
      - apps/api/.env.development
    environment:
      DATABASE_URL: postgresql://payroll:payroll@postgres:5432/payroll?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      IDEMPOTENCY_TTL_SECONDS: 86400
      IDEMPOTENCY_SWEEP_INTERVAL_MS: 60000
      # BullMQ stalled-job recovery + worker liveness heartbeat (design D3/D4).
      PAYROLL_WORKER_LOCK_DURATION_MS: 30000
      PAYROLL_WORKER_STALLED_INTERVAL_MS: 30000
      PAYROLL_WORKER_MAX_STALLED_COUNT: 1
      WORKER_HEARTBEAT_INTERVAL_MS: 5000
    depends_on:
      api:
        condition: service_healthy

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Bake-time API origin; default matches dev mode (host runs on :3000).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: payroll_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  # ─── Observability stack (OPTIONAL — docker compose --profile observability up) ──
  # Profile-scoped: the default `docker compose up` service set is byte-identical
  # without them (observability design D5). Prometheus scrapes api/worker on the
  # internal network; Grafana provisions the payroll datasource + starter
  # dashboard; jaeger all-in-one receives OTLP traces (OTEL_TRACES_ENABLED=true).
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: payroll_prometheus
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3.1
    container_name: payroll_grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"

  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    container_name: payroll_jaeger
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4318:4318"   # OTLP/HTTP traces from api + worker
      - "16686:16686" # UI

volumes:
  pgdata:
